; CARDio firmware (ESP32-C3 + MAX30102 + 13x WS2812B-2020)
;
;   pio run                   build
;   pio run -t upload         flash (asks the running firmware to park the I2C bus first)
;   pio device monitor        serial log / commands (type "help")

[env:cardio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; Matches the image that shipped on the card (DIO, 80 MHz, 4 MB embedded flash).
board_build.flash_mode = dio

build_flags =
    -DARDUINO_USB_MODE=1          ; Serial = the C3's built-in USB-Serial/JTAG port
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3

upload_speed = 921600
monitor_speed = 115200
; Toggling DTR/RTS on the USB-Serial/JTAG port resets the chip; keep them idle.
monitor_dtr = 0
monitor_rts = 0

extra_scripts = scripts/park_before_upload.py
